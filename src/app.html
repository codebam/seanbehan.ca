<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- The page follows the OS theme; no toggle, no stored preference. Declaring
		     both here stops the browser painting a white flash before CSS lands. -->
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f4" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111110" />
		<link rel="manifest" href="/site.webmanifest" />
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
