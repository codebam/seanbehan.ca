<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- SVG where it is supported, then .ico for the browsers that only look for
		     one, then the sized PNGs. The SVG's lettering is outlined, so it needs
		     no font installed — see tools/favicon. -->
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- The page follows the OS theme; no toggle, no stored preference. Declaring
		     both here stops the browser painting a white flash before CSS lands. -->
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f4" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111110" />
		<link rel="manifest" href="/site.webmanifest" />
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
