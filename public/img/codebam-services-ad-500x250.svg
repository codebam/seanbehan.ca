<!--
  seanbehan.ca — website and Telegram bot services, 500x250.

  Drawn in the Open Studio Index dark values from src/styles/app.css:
  bg #24211d, panel #34302b, line #4a443d, text #fbf8f3,
  body #d7d0c7 and accent #315dc5 with white labels. The ring and call to
  action carry the blue; small labels use the readable warm-grey tint.

  Re-ink here when the tokens move, then rasterise the live exports with
  `node tools/ads/build-ads.mjs`. The font stack falls back to Arial because
  no face is embedded; if the copy changes on a paid placement, rasterise and
  check the render rather than trusting the system font.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="250" viewBox="0 0 500 250" role="img" aria-labelledby="title desc">
  <title id="title">codebam website and Telegram bot services</title>
  <desc id="desc">Advertisement for custom website and Telegram bot development at seanbehan.ca/services.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="500" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24211d"/>
      <stop offset="0.58" stop-color="#34302b"/>
      <stop offset="1" stop-color="#4a443d"/>
    </linearGradient>
    <linearGradient id="accent" x1="278" y1="33" x2="477" y2="217" gradientUnits="userSpaceOnUse">
      <stop stop-color="#315dc5"/>
      <stop offset="0.5" stop-color="#fbf8f3"/>
      <stop offset="1" stop-color="#315dc5"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="500" height="250" rx="3"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="500" height="250" fill="url(#field)"/>
    <g opacity="0.14" stroke="#315dc5" stroke-width="1">
      <path d="M0 25h500M0 50h500M0 75h500M0 100h500M0 125h500M0 150h500M0 175h500M0 200h500M0 225h500"/>
      <path d="M25 0v250M50 0v250M75 0v250M100 0v250M125 0v250M150 0v250M175 0v250M200 0v250M225 0v250M250 0v250M275 0v250M300 0v250M325 0v250M350 0v250M375 0v250M400 0v250M425 0v250M450 0v250M475 0v250"/>
    </g>

    <circle cx="403" cy="125" r="98" fill="#34302b" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="403" cy="125" r="76" fill="none" stroke="#315dc5" stroke-opacity="0.2"/>
    <path d="M307 168 492 89" stroke="#315dc5" stroke-opacity="0.13" stroke-width="42"/>

    <g fill="#fbf8f3" font-family="Inter, Arial, sans-serif">
      <text x="20" y="31" font-size="18" font-weight="700">codebam<tspan fill="#fbf8f3">.</tspan></text>
      <text x="20" y="61" fill="#d7d0c7" font-family="monospace" font-size="10" letter-spacing="1.5">CUSTOM DEVELOPMENT</text>
      <text x="20" y="103" font-size="39" font-weight="750" letter-spacing="-1.7">Websites</text>
      <text x="20" y="139" font-size="20" font-weight="500">+</text>
      <text x="20" y="178" font-size="35" font-weight="750" letter-spacing="-1.4">Telegram Bots</text>
      <text x="20" y="204" fill="#d7d0c7" font-size="13">Scoped with you. Built to ship.</text>
    </g>

    <g fill="#fbf8f3" font-family="Inter, Arial, sans-serif" text-anchor="middle">
      <text x="403" y="88" fill="#d7d0c7" font-family="monospace" font-size="10" letter-spacing="1.2">HAVE AN IDEA?</text>
      <text x="403" y="121" font-size="25" font-weight="700">Start a</text>
      <text x="403" y="149" font-size="25" font-weight="700">project.</text>
    </g>

    <g transform="translate(307 165)">
      <rect width="190" height="47" rx="2" fill="#315dc5"/>
      <text x="95" y="30" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">seanbehan.ca/services</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="499" height="249" rx="2.5" fill="none" stroke="#4a443d"/>
</svg>
