<svg xmlns="http://www.w3.org/2000/svg" width="500" height="250" viewBox="0 0 500 250" role="img" aria-labelledby="title desc">
  <title id="title">codebam website and Telegram bot services</title>
  <desc id="desc">Advertisement for custom website and Telegram bot development at codebam.ca/services.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="500" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111f"/>
      <stop offset="0.58" stop-color="#0d1c34"/>
      <stop offset="1" stop-color="#17396d"/>
    </linearGradient>
    <linearGradient id="accent" x1="278" y1="33" x2="477" y2="217" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f8cff"/>
      <stop offset="0.5" stop-color="#ff893b"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="500" height="250" rx="3"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="500" height="250" fill="url(#field)"/>
    <g opacity="0.14" stroke="#4f8cff" stroke-width="1">
      <path d="M0 25h500M0 50h500M0 75h500M0 100h500M0 125h500M0 150h500M0 175h500M0 200h500M0 225h500"/>
      <path d="M25 0v250M50 0v250M75 0v250M100 0v250M125 0v250M150 0v250M175 0v250M200 0v250M225 0v250M250 0v250M275 0v250M300 0v250M325 0v250M350 0v250M375 0v250M400 0v250M425 0v250M450 0v250M475 0v250"/>
    </g>

    <circle cx="403" cy="125" r="98" fill="#0b172a" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="403" cy="125" r="76" fill="none" stroke="#4f8cff" stroke-opacity="0.2"/>
    <path d="M307 168 492 89" stroke="#4f8cff" stroke-opacity="0.13" stroke-width="42"/>

    <g fill="#f2f5fb" font-family="Inter, Arial, sans-serif">
      <text x="20" y="31" font-size="18" font-weight="700">codebam<tspan fill="#ff893b">.</tspan></text>
      <text x="20" y="61" fill="#79a7ff" font-family="monospace" font-size="10" letter-spacing="1.5">CUSTOM DEVELOPMENT</text>
      <text x="20" y="103" font-size="39" font-weight="750" letter-spacing="-1.7">Websites</text>
      <text x="20" y="139" font-size="20" font-weight="500">+</text>
      <text x="20" y="178" font-size="35" font-weight="750" letter-spacing="-1.4">Telegram Bots</text>
      <text x="20" y="204" fill="#b8c4d8" font-size="13">Scoped with you. Built to ship.</text>
    </g>

    <g fill="#f2f5fb" font-family="Inter, Arial, sans-serif" text-anchor="middle">
      <text x="403" y="88" fill="#79a7ff" font-family="monospace" font-size="10" letter-spacing="1.2">HAVE AN IDEA?</text>
      <text x="403" y="121" font-size="25" font-weight="700">Start a</text>
      <text x="403" y="149" font-size="25" font-weight="700">project.</text>
    </g>

    <g transform="translate(307 165)">
      <rect width="190" height="47" rx="2" fill="#4f7fff"/>
      <text x="95" y="30" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">codebam.ca/services</text>
    </g>
