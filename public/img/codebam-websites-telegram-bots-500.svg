<!--
  seanbehan.ca — websites and Telegram bots, 500x500.

  Drawn in the dark scheme's token values from src/styles/app.css:
  bg #131110, panel #1b1817, line #322d2a, text #f2ede4,
  body #d6cec2, accent #7fb3e0, accent-on #131110 and warm #e0a458.
  The ring is the only place the warm accent appears; the call to action is
  the accent / accent-on pair.

  Re-ink here when the tokens move, then rasterise the live export with
  `node tools/ads/build-ads.mjs`. The font stack falls back to Arial because
  no face is embedded.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">codebam websites and Telegram bots advertisement</title>
  <desc id="desc">Circular advertisement offering custom websites and Telegram bots.</desc>
  <defs>
    <radialGradient id="field" cx="35%" cy="25%" r="80%">
      <stop offset="0" stop-color="#322d2a"/>
      <stop offset="0.58" stop-color="#1b1817"/>
      <stop offset="1" stop-color="#131110"/>
    </radialGradient>
    <linearGradient id="ring" x1="65" y1="65" x2="435" y2="435" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7fb3e0"/>
      <stop offset="0.5" stop-color="#e0a458"/>
      <stop offset="1" stop-color="#7fb3e0"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="250" cy="250" r="222"/>
    </clipPath>
  </defs>

  <rect width="500" height="500" fill="#131110"/>
  <g opacity="0.16" stroke="#7fb3e0" stroke-width="1">
    <path d="M0 50h500M0 100h500M0 150h500M0 200h500M0 250h500M0 300h500M0 350h500M0 400h500M0 450h500"/>
    <path d="M50 0v500M100 0v500M150 0v500M200 0v500M250 0v500M300 0v500M350 0v500M400 0v500M450 0v500"/>
  </g>

  <circle cx="250" cy="250" r="226" fill="#131110" stroke="url(#ring)" stroke-width="3"/>
  <g clip-path="url(#circle)">
    <circle cx="250" cy="250" r="222" fill="url(#field)"/>
    <path d="M14 365 486 168" stroke="#7fb3e0" stroke-opacity="0.12" stroke-width="78"/>
    <circle cx="378" cy="120" r="82" fill="none" stroke="#e0a458" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="378" cy="120" r="57" fill="none" stroke="#e0a458" stroke-opacity="0.18" stroke-width="1"/>
  </g>

  <g fill="#f2ede4" font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="250" y="93" font-size="23" font-weight="700">codebam<tspan fill="#e0a458">.</tspan></text>
    <text x="250" y="134" fill="#7fb3e0" font-family="monospace" font-size="10" letter-spacing="3">DESIGN  ·  BUILD  ·  SHIP</text>

    <text x="250" y="208" font-size="47" font-weight="750" letter-spacing="-2">Websites</text>
    <text x="250" y="260" font-size="25" font-weight="500">+</text>
    <text x="250" y="316" font-size="42" font-weight="750" letter-spacing="-2">Telegram Bots</text>

    <text x="250" y="357" fill="#d6cec2" font-size="14">Custom-built for your business.</text>
  </g>

  <g transform="translate(145 382)">
    <rect width="210" height="43" rx="2" fill="#7fb3e0"/>
    <text x="105" y="27" fill="#131110" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">seanbehan.ca/services</text>
  </g>
  <circle cx="250" cy="451" r="3" fill="#e0a458"/>
</svg>
