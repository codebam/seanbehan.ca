name: Deploy

# The site was built by Cloudflare's git integration when it was a Pages
# project. It is a Worker now, and a Worker is deployed by wrangler — which
# means the deploy is a job here rather than something that happens invisibly
# on push, and the purge that has to follow it can finally be part of the same
# run instead of a workflow racing the build.
on:
  push:
    branches: [master]
  # For a redeploy that no push justifies.
  workflow_dispatch:

# A deployment may have migrated the shared database or updated one origin.
# Finish that rollout before a newer push starts rather than stranding variants.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Checks may run for any ref; nothing below receives a production credential
  # until it has survived review on master.
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    # Deploy and purge use production-wide credentials. A non-master
    # workflow_dispatch still runs verify but stops here.
    needs: migrate
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Both origins are one repo and one database; they differ only in the
    # identity baked in at build time, so each is built and deployed in turn.
    strategy:
      # Not fail-fast: if seanbehan.ca deploys and codebam.ca does not, the
      # first one having landed is still worth having.
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - variant: seanbehan
            build: build
            wrangler_args: ''
            zone: seanbehan.ca
          - variant: codebam
            build: build:codebam
            wrangler_args: --env codebam
            zone: codebam.ca
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Build before exposing a production credential. Astro and its plugins do
      # not need Cloudflare access to produce the Worker bundle.
      - name: Build ${{ matrix.variant }}
        run: npm run ${{ matrix.build }}

      - name: Deploy ${{ matrix.variant }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy ${{ matrix.wrangler_args }}

      # Pages are rendered per request and held at the edge for ten minutes, so
      # a purge is no longer about stale HTML referencing bundles that have gone
      # away — it is about the deploy being visible now rather than in ten
      # minutes. See docs/edge-caching.md.
      - name: Purge ${{ matrix.zone }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: bash tools/cloudflare/purge.sh ${{ matrix.zone }}

      # The rollout is finished only once the database the deployed Worker reads
      # matches the migrations this build expects. A runtime that migrates on
      # first request cannot report a mismatch after the fact; `--check` exits
      # non-zero on pending or unknown migrations. It is read-only, so it runs
      # per variant rather than being folded into the migrate job — and it runs
      # after the purge, because a failed check is no reason to leave stale HTML
      # at the edge.
      - name: Check EmDash migrations ${{ matrix.variant }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npm run migrate:core:check

  # Both Workers share one D1 database, and two migration sets reach it: this
  # repo's own, which wrangler applies, and EmDash's core set, which
  # `emdash migrate` applies. Both are applied once here, before either build
  # can deploy code that expects the new schema.
  migrate:
    # Schema changes run against the shared production D1; only a reviewed
    # master ref may apply them.
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # `emdash migrate` reads .emdash/migrations.json, and only the build
      # writes it: the manifest is a build artifact, not a committed file. The
      # deploy jobs build this same commit separately and get the same
      # migration set, because the set comes from the installed EmDash version.
      - name: Build
        run: npm run build

      # Resolve and print the account, database and target fingerprint before
      # anything is written. A database_id or binding that no longer points at
      # the intended database fails here rather than mid-migration.
      - name: Inspect the EmDash migration target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npm run migrate:core:status

      # EmDash's core migrations run before this repo's: migrations/site is
      # written against the EmDash version in this commit. The fingerprint is a
      # pinned repository variable rather than something computed here, so an
      # edited database_id cannot silently retarget the run — and with it unset
      # or stale the command refuses instead of applying, because a
      # noninteractive apply will not proceed without a matching fingerprint.
      - name: Apply EmDash core migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          EMDASH_TARGET_FINGERPRINT: ${{ vars.EMDASH_TARGET_FINGERPRINT }}
        run: npm run migrate:core:prod

      - name: Apply site migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npm run migrate:prod
