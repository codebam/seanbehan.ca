name: Design preview

# Design branches get a Cloudflare Worker Preview: a branch-scoped environment
# under the same Worker, served on its own hostname (preview.<zone>). This is
# the only workflow that publishes anything from a non-master ref — `deploy.yml`
# still owns production and only runs on master, and `preview_urls`/`workers_dev`
# stay off for the deployed Worker (docs/edge-caching.md §1). The trigger is
# deliberately narrow: a Preview is public by default, so only explicit design
# explorations get one.
#
# Worker Previews need Wrangler 4.135 or newer; the repo pins 4.131, so this
# job runs the command through `npx wrangler@latest` instead of bumping the
# project dependency for a beta feature. See wrangler.jsonc's `previews` block
# for what the preview is bound to, and docs/edge-caching.md for the posture
# this deliberately steps around.
on:
  push:
    branches: ['redesign/**']
  # For a re-run after preview-side settings change, without an empty commit.
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # npm ci and the build below execute code from the branch; without
          # this the checkout leaves a token in .git/config for that code.
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # One variant: the preview exists to judge the design, and seanbehan.ca
      # is the origin the writing and the commerce live on.
      - name: Build
        run: npm run build

      # The adapter writes a session KV binding (SESSION) into the generated
      # config with no namespace id. `wrangler deploy` provisions that namespace
      # on first deploy, but the Preview deployment API refuses a binding
      # without one (code 10021) — and previews read only the `previews` block,
      # so there is nothing to inherit. A design preview does not need session
      # storage: the auth flows that would use it are dead here anyway, since a
      # preview gets no email bindings and no secrets. Drop the binding rather
      # than pin every branch to a production namespace id.
      - name: Drop the unprovisioned session binding
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "dist/server/wrangler.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            if (config.previews) delete config.previews.kv_namespaces;
            fs.writeFileSync(path, JSON.stringify(config));
          '

      # `wrangler preview` reads the config the adapter wrote into
      # dist/server/wrangler.json (via .wrangler/deploy/config.json), so the
      # build above has to run first. The name is the branch with its slash
      # flattened; it defaults to the git branch, which is detached here.
      - name: Publish Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ github.ref_name }}
        run: |
          set -o pipefail
          name="$(printf '%s' "$PREVIEW_NAME" | tr '[:upper:]/' '[:lower:]-')"
          message="$(git log -1 --format='%h %s')"
          npx --yes wrangler@latest preview \
            --name "$name" \
            --message "$message" \
            2>&1 | tee preview.log
          # Wrangler colours its output; strip the escapes before parsing. The
          # URL is the Preview's own hostname (a preview.<zone> custom domain
          # here, not workers.dev), so read it off the labelled lines rather
          # than matching a host.
          clean="$(sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' preview.log)"
          url="$(printf '%s\n' "$clean" | grep -oE 'Preview URL:[[:space:]]*https://[^[:space:]]+' | head -1 | sed -E 's/^Preview URL:[[:space:]]*//')"
          deploy_url="$(printf '%s\n' "$clean" | grep -oE 'Unique Deployment URL:[[:space:]]*https://[^[:space:]]+' | head -1 | sed -E 's/^Unique Deployment URL:[[:space:]]*//')"
          # The deployment has already succeeded by the time we parse; failing
          # to find the URL is worth a warning, not a red run.
          if [ -z "$url" ]; then
            echo "::warning::wrangler preview finished without printing a Preview URL; see the log above."
            printf '%s\n' "$clean" | tail -20 >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Preview: \`$name\`"
            echo
            echo "$url"
            if [ -n "$deploy_url" ]; then
              echo
              echo "This deployment: $deploy_url"
            fi
            echo
            echo "_The previews block carries no DOWNLOADS binding and no email bindings, by design. Delete the branch or the Preview when the design decision is made._"
          } >> "$GITHUB_STEP_SUMMARY"
