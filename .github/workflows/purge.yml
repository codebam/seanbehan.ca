name: Purge edge cache

# Cloudflare's git integration builds on push and never reports back to GitHub,
# so there is no `deployment_status` to hook. This waits for the Pages API to
# show this commit live, then purges — see docs/edge-caching.md for why a purge
# after every deploy is not optional.
on:
  push:
    branches: [master]
  # For a deploy that happened without a push, or a purge you just want to run.
  workflow_dispatch:

# A newer push supersedes this one: purging for an older commit after a newer
# deployment has landed is at best wasted work.
concurrency:
  group: purge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  purge:
    runs-on: ubuntu-latest
    # Both zones are built from this one repo by two Pages projects, so both
    # need waiting on and both need purging. `zone` is what purge.sh takes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: seanbehan-ca
            zone: seanbehan.ca
          - project: codebam-ca
            zone: codebam.ca
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the Pages deployment
        if: github.event_name == 'push'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: bash tools/cloudflare/await-deploy.sh ${{ matrix.project }} ${{ github.sha }}

      - name: Purge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: bash tools/cloudflare/purge.sh ${{ matrix.zone }}
