name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Callable so the Dependabot auto-merge workflow can gate on the same checks
  # instead of duplicating them.
  workflow_call:

# Everything here only reads the repository. Keeping the default token
# read-only also bounds what the reusable call in dependabot_auto-merge.yml
# hands to the dependency install code it runs from a PR.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # npm ci and the builds below execute code from the PR; without this
          # the checkout leaves a token in .git/config for that code to read.
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # One source of truth, shared with the deploy workflow, so the checks
          # gating a deploy run on the runtime that serves it.
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Test
        run: npm run test:run

      - name: Test operator scripts
        run: npm run test:scripts

      - name: Validate site migrations
        run: npm run migrate:local

      # Both variants, because the identity is chosen at build time and a
      # change that breaks only codebam.ca would otherwise reach master green.
      - name: Build seanbehan
        run: npm run build

      - name: Build codebam
        run: npm run build:codebam

  # Zone state is versioned nowhere else, which is how the live rules drifted
  # from what this repo documented. The report is read-only, but it runs the
  # checked-out script with a production-wide Cloudflare token, and a PR branch
  # can edit that script before review. Only a reviewed master push may reach
  # it; every pull_request and workflow_call skips it.
  zone-posture:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Report zone posture
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "CF_API_TOKEN is not configured here; skipping the zone posture report."
            exit 0
          fi
          bash tools/cloudflare/zone-posture.sh
