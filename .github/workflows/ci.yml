name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Callable so the Dependabot auto-merge workflow can gate on the same checks
  # instead of duplicating them.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # One source of truth, shared with the deploy workflow, so the checks
          # gating a deploy run on the runtime that serves it.
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Test
        run: npm run test:run

      - name: Test operator scripts
        run: npm run test:scripts

      - name: Validate site migrations
        run: npm run migrate:local

      # Both variants, because the identity is chosen at build time and a
      # change that breaks only codebam.ca would otherwise reach master green.
      - name: Build seanbehan
        run: npm run build

      - name: Build codebam
        run: npm run build:codebam

  # Zone state is versioned nowhere else, which is how the live rules drifted
  # from what this repo documented. Read-only, and skipped rather than failed
  # when the secret is absent (forks, Dependabot's workflow_call) so an
  # unauthenticated contribution still gets the same green checks.
  zone-posture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Report zone posture
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "${CF_API_TOKEN:-}" ]; then
            echo "CF_API_TOKEN is not configured here; skipping the zone posture report."
            exit 0
          fi
          bash tools/cloudflare/zone-posture.sh
