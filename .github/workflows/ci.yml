name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Callable so the Dependabot auto-merge workflow can gate on the same checks
  # instead of duplicating them.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Test
        run: npm run test:run

      - name: Build
        # The home page pulls project star counts from the GitHub API during
        # prerender. Passing a token avoids the shared-runner rate limit; the
        # build falls back to committed values if it fails either way.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
