name: Zone posture

# Zone-level settings that the Worker cannot set and the deploy must not drift
# away from. Report mode is the default; apply mode also purges both zones.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply Browser Cache TTL and HSTS, bypass HTML edge caching, then purge
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  posture:
    # Report mode is read-only, but apply mode changes zone settings and the
    # job runs a checked-out script with a zone-wide token. A manual dispatch
    # can name any ref, so only reviewed master may receive that credential.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Report or apply zone posture
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            # Applying without --no-edge-cache would run cache-rule.sh, whose
            # cache-on rule is what let a hostless apex entry answer www and
            # skip the redirect. Keep the HTML rule in bypass until the
            # host-scoped cache key is verified; --drop-legacy-cache removes
            # the Page Rules that cache everything.
            bash tools/cloudflare/zone-posture.sh --apply --no-edge-cache --drop-legacy-cache
          else
            bash tools/cloudflare/zone-posture.sh
          fi
