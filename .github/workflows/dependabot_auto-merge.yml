name: Dependabot auto-merge

on: pull_request

jobs:
  # Auto-merge lands dependency bumps straight on master, and master deploys.
  # Gate it on the full check suite so a bump that breaks lint, types, tests or
  # the build cannot ship unattended.
  ci:
    if: ${{ github.actor == 'dependabot[bot]' }}
    # The called workflow runs `npm ci` and the builds against the PR. A
    # read-only token is the whole grant it needs; the write grant lives on the
    # job below, which runs no dependency code.
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  merge_pr:
    needs: ci
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
